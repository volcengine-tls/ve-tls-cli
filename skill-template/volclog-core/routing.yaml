intents:
  - intent: discover-public-api
    keywords: [list, show, inspect, enumerate]
    preferred_surface: tool
    first_command: volclog tool list <group>
    fallback: volclog tool describe <group.action>
    retry_with_verb: volclog tool list <group> --verb <user-intent-verb>
    notes:
      - Prefer tool for published public APIs.
  - intent: execute-public-write
    keywords: [create, get, modify, delete, update]
    preferred_surface: tool
    first_command: volclog tool describe <group.action>
    fallback: volclog tool exec <group.action> --dry-run
    retry_with_verb: volclog tool list <group> --verb create
    notes:
      - Follow with tool exec and dry-run first.
  - intent: inspect-host-groups
    keywords: [host-group, machine group, agent list, inspect hosts]
    preferred_surface: tool
    preferred_id: host-group.describe-host-groups-v2
    first_command: volclog tool list host-group --verb list
    fallback: volclog tool describe host-group.describe-host-groups-v2
    retry_with_verb: volclog tool list host-group --verb list
  - intent: inspect-alarms
    keywords: [alarm, alert, notification policy, incident rule]
    preferred_surface: tool
    preferred_id: alarm.describe-alarms
    first_command: volclog tool list alarm --verb list
    fallback: volclog tool describe alarm.describe-alarms
    retry_with_verb: volclog tool list alarm --verb list
  - intent: ingest-logs
    keywords: [ingest, upload, ship, write logs, put logs]
    preferred_surface: workflow
    preferred_id: log.ingest
    first_command: volclog workflow describe log.ingest
    fallback: volclog tool describe log.put
    retry_with_verb: volclog tool list log --verb put
  - intent: export-search-results
    keywords: [export, download logs, dump search results]
    preferred_surface: workflow
    preferred_id: log.export
    first_command: volclog workflow describe log.export
    fallback: volclog tool describe log.search
    retry_with_verb: volclog tool list log --verb search
  - intent: export-analysis-results
    keywords: [analyze, sql export, export analysis]
    preferred_surface: workflow
    preferred_id: log.export-analysis
    first_command: volclog workflow describe log.export-analysis
    fallback: volclog tool describe log.search
    retry_with_verb: volclog tool list log --verb search
  - intent: exact-method-path
    keywords: [raw, method, path, transport]
    preferred_surface: raw
    first_command: volclog raw --method <METHOD> --path <PATH>
    fallback: volclog tool list <group>
    retry_with_verb: volclog tool list <group> --verb <user-intent-verb>
