recipes:
  - error_signature: unknown tool
    http_status: 0
    error_code: CLIError
    likely_cause: wrong surface or wrong identity
    exact_fix: rerun tool list or workflow list for the group before guessing aliases
    retry_command: volclog tool list <group>
  - error_signature: missing --input
    http_status: 0
    error_code: CLIError
    likely_cause: wrong transport or unread contract
    exact_fix: reread input_schema and input_encoding_hint, then resend inline JSON, stdin, or file input
    retry_command: volclog tool describe <group.action>
  - error_signature: filter matched no value
    http_status: 0
    error_code: CLIError
    likely_cause: jmes path points at the wrong layer of the response
    exact_fix: inspect one unfiltered response first, then decide whether you are filtering the full CLI envelope via --jmes-filter or the raw result via execution.projection
    retry_command: rerun without filter/projection, then retry with a corrected path
  - error_signature: jmes filter returned literal null
    http_status: 0
    error_code: ""
    likely_cause: the selected envelope field exists and its value is null
    exact_fix: treat literal null as a successful projection result; only switch to debugging if the command returned a filter matched no value error instead
    retry_command: inspect the unfiltered envelope only if null was unexpected
  - error_signature: 401 Unauthorized
    http_status: 401
    error_code: Unauthorized
    likely_cause: credentials, region, or endpoint do not match
    exact_fix: run doctor first, then verify AK/SK, region, and endpoint before retrying
    retry_command: volclog doctor
  - error_signature: 403 Forbidden
    http_status: 403
    error_code: ""
    likely_cause: profile has no permission or the wrong tenant/profile is selected
    exact_fix: confirm the selected profile matches the target tenant and region, then verify resource permissions before retrying
    retry_command: volclog configure list
  - error_signature: IndexNotExists
    http_status: 404
    error_code: IndexNotExists
    likely_cause: index does not exist or is not ready
    exact_fix: inspect the current index first, then create it or wait for readiness before retrying search
    retry_command: volclog tool describe index.describe
  - error_signature: TopicAlreadyExist
    http_status: 409
    error_code: TopicAlreadyExist
    likely_cause: create request is targeting an existing topic
    exact_fix: re-list topics in the target project, then switch to get or modify instead of repeating create
    retry_command: volclog tool list topic --verb list
  - error_signature: ProjectAlreadyExist
    http_status: 409
    error_code: ProjectAlreadyExist
    likely_cause: create request is targeting an existing project
    exact_fix: re-list projects, then switch to get or modify instead of repeating create
    retry_command: volclog tool list project --verb list
  - error_signature: ResultStatus=incomplete
    http_status: 0
    error_code: ""
    likely_cause: service returned only a partial scan to keep latency short
    exact_fix: narrow the time range and rerun before trusting counts, returned rows, empty results, or histogram buckets; this can happen for SearchLogs in both search and analysis mode
    retry_command: rerun the same query on a narrower time window
  - error_signature: search returned empty after write
    http_status: 0
    error_code: ""
    likely_cause: wrong profile, wrong topic, wrong time range, or index not ready
    exact_fix: verify profile/topic/index first, then retry with narrow time range and trace enabled
    retry_command: volclog configure list
  - error_signature: huge stdout payload
    http_status: 0
    error_code: ""
    likely_cause: output strategy was chosen too late
    exact_fix: rerun with --output-mode file and a writable --output-dir, or reduce stdout with --jmes-filter / execution.projection
    retry_command: volclog --output-mode file --output-dir <writable-dir> <same-command>
