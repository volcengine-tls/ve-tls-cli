workflows:
  - name: validate-existing-searchable-log-pipeline
    when_to_use: inspect an existing project/topic/index path and confirm search works without mutating state
    steps:
      - configure.list
      - topic.describe-topic
      - index.describe
      - log.search
    output_strategy: keep identifiers and narrow validation signals in stdout; let CLI choose file delivery later if needed
    fallback: raw.SearchLogs
    stop_condition: wrong target identified or search returns the expected shape
  - name: validate-after-write-path
    when_to_use: a write/import path already finished elsewhere and the next step is readonly validation
    steps:
      - log.search
      - workflow.log.export
    output_strategy: keep ingest stdout small; validation stays narrow until a later export is truly needed
    fallback: workflow.log.export
    stop_condition: one readonly validation query returns rows
  - name: troubleshoot-empty-search
    when_to_use: writes succeeded but search returns empty
    steps:
      - configure.list
      - topic.describe-topic
      - index.describe
      - log.search
    output_strategy: keep the time range narrow and confirm target/profile/index before widening the query
    fallback: raw.SearchLogs
    stop_condition: wrong target identified or search starts returning rows
  - name: preview-search-volume
    when_to_use: decide whether to narrow time range, preview rows, or switch to export
    steps:
      - tool.log.describe-histogram-v1
      - tool.log.search
      - workflow.log.export
      - workflow.log.export-analysis
    output_strategy: use histogram for pure-search bucket preview first, then choose interactive rows or export surface
    fallback: raw.SearchLogs
    stop_condition: bucket distribution and next execution surface are both clear
  - name: export-large-results
    when_to_use: result set is too large for stdout or token budget
    steps:
      - workflow.log.export
      - workflow.log.export-analysis
    output_strategy: choose the export workflow here when the user needs a file of rows, not just interactive preview; let CLI deliveryMode decide stdout vs file_auto unless the caller explicitly forces file output with a writable output_dir
    fallback: tool.log.search
    stop_condition: stdout returns the artifact path and the written row file confirms the expected data shape
