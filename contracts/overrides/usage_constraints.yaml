# Tool catalog execution constraints overrides.
# Format:
#   <tool_id>: <constraint tag>
log.create-download-task: "Asynchronous submission: HTTP 200 with TaskId means accepted, not file-ready. Query log.describe-download-tasks with the original TopicId; TaskName is a fuzzy filter, so match Tasks[].TaskId and inspect further pages. wait/creating are nonterminal; success means file generated within the requested task limits; created_cut is partial; fail is failed. Get an available result with log.describe-download-url. The CLI does not wait automatically. Source: official CreateDownloadTask, DescribeDownloadTasks, DescribeDownloadUrl API documentation."
log.describe-download-tasks: "This reads a task list, not the completion of every task. Match the intended Tasks[].TaskId across pages; TopicId is required and TaskName is only a fuzzy filter. TaskStatus wait/creating are nonterminal, success is file generated, created_cut is a partial terminal result, and fail is failure. Unknown statuses do not prove completion. success does not override the original task Limit or query scope. Source: official DescribeDownloadTasks API documentation."
log.describe-download-url: "Read the URL for the intended TaskId after checking log.describe-download-tasks. success tasks can download; only some created_cut tasks have a partial file. The URL is unauthenticated and valid for five minutes, so do not publish it as a durable artifact. Source: official DescribeDownloadUrl API documentation."
topic.create: "CreateTopic documents ShardCount as required with default 1. The catalog permits omission and the CLI sends no default."
topic.describe-topic: "Read MeteringMode, Ttl (total log retention in days), and the optional DataIngestSpec storage entitlement from data."
topic.describe-topics: "Each entry in data.Topics exposes MeteringMode, Ttl (total log retention in days), and DataIngestSpec when returned by the service."
processor.create-processor: "Unresolved documentation discrepancy: official CreateProcessor marks ProcessorType required; the current catalog keeps it optional with default ingester. The CLI does not insert this default. Verify the service contract before changing requiredness."
import.describe-import-task: "Unresolved documentation discrepancy: official DescribeImportTask marks TaskId optional, while the current catalog requires it. Requiredness is retained pending service verification."
tag.list: "Unresolved documentation discrepancy: official ListTagsForResources makes MaxResults optional with default 20 and maximum 100; the current catalog requires it with range 10..100. The CLI does not insert a default. These differences remain pending service verification."
log-back-flow.create: "Unresolved documentation discrepancy: official CreateLogBackFlowTask marks BackFlowStartTime optional, while the current catalog requires it. Requiredness is retained pending service verification."
