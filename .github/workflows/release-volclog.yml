name: release-volclog

on:
  push:
    tags:
      - "volclog-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GOFLAGS: ${{ matrix.goflags }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            cgo_enabled: "0"
            goflags: ""
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            cgo_enabled: "0"
            goflags: ""
          - goos: darwin
            goarch: amd64
            runner: macos-15
            cgo_enabled: "1"
            goflags: "-ldflags=-linkmode=external"
            macosx_deployment_target: "11.0"
          - goos: darwin
            goarch: arm64
            runner: macos-15
            cgo_enabled: "1"
            goflags: "-ldflags=-linkmode=external"
            macosx_deployment_target: "11.0"
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
            cgo_enabled: "0"
            goflags: ""
          - goos: windows
            goarch: arm64
            runner: ubuntu-latest
            cgo_enabled: "0"
            goflags: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Verify release versions
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          human_version="$(node -p "require('./npm/human-package/package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          expected_tag="volclog-v${package_version}"
          test "${GITHUB_REF_NAME}" = "${expected_tag}"
          test "${human_version}" = "${package_version}"
          test "${lock_version}" = "${package_version}"
      - name: Test
        run: |
          go test ./...
          npm run test:npm --silent
      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="volclog-v$(node -p "require('./package.json').version")"
          fi
          for edition in default human; do
            bin_name="volclog"
            build_args=()
            if [ "$edition" = "human" ]; then
              bin_name="volclog-human"
              build_args=(-tags=human)
            fi
            out="dist/$bin_name"
            if [ "$GOOS" = "windows" ]; then
              out="${out}.exe"
            fi
            ldflags="-s -w -X github.com/volcengine-tls/ve-tls-cli/internal/version.Version=${version}"
            if [ "$GOOS" = "darwin" ]; then
              ldflags="$ldflags -linkmode=external"
              build_args+=( -a )
            fi
            build_args+=( -trimpath -ldflags "$ldflags" -o "$out" ./cmd/volclog )
            go build "${build_args[@]}"

            if [ "$GOOS" = "darwin" ]; then
              otool -l "$out" | grep -q 'cmd LC_UUID'
              minos="$(otool -l "$out" | awk '
                $1 == "cmd" && $2 == "LC_BUILD_VERSION" { in_build_version = 1; next }
                in_build_version && $1 == "minos" { print $2; exit }
              ')"
              test "$minos" = "$MACOSX_DEPLOYMENT_TARGET"
            fi

            pkg_dir="$(mktemp -d)"
            cp "$out" "$pkg_dir/"
            if [ "$GOOS" = "windows" ]; then
              pkg="${bin_name}_${GOOS}_${GOARCH}.zip"
              (cd "$pkg_dir" && zip -q "$pkg" "$(basename "$out")")
            else
              pkg="${bin_name}_${GOOS}_${GOARCH}.tar.gz"
              (cd "$pkg_dir" && tar -czf "$pkg" "$(basename "$out")")
            fi
            mv "$pkg_dir/$pkg" "dist/$pkg"
            if command -v sha256sum >/dev/null 2>&1; then
              (cd dist && sha256sum "$pkg" > "${pkg}.sha256")
            else
              (cd dist && shasum -a 256 "$pkg" > "${pkg}.sha256")
            fi
            rm -rf "$pkg_dir"
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: volclog-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: ignore
          path: |
            dist/volclog_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            dist/volclog_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256
            dist/volclog-human_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            dist/volclog-human_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256
            dist/volclog_${{ matrix.goos }}_${{ matrix.goarch }}.zip
            dist/volclog_${{ matrix.goos }}_${{ matrix.goarch }}.zip.sha256
            dist/volclog-human_${{ matrix.goos }}_${{ matrix.goarch }}.zip
            dist/volclog-human_${{ matrix.goos }}_${{ matrix.goarch }}.zip.sha256

  release:
    if: github.ref_type == 'tag'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: ${{ contains(github.ref_name, '-rc.') && 'false' || 'legacy' }}
          files: |
            dist/volclog_*.tar.gz
            dist/volclog_*.tar.gz.sha256
            dist/volclog_*.zip
            dist/volclog_*.zip.sha256
            dist/volclog-human_*.tar.gz
            dist/volclog-human_*.tar.gz.sha256
            dist/volclog-human_*.zip
            dist/volclog-human_*.zip.sha256
            scripts/install-binary.sh
            scripts/install.ps1
