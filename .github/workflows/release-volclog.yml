name: release-volclog

on:
  push:
    tags:
      - "volclog-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Test
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          set -euo pipefail
          version="${{ github.ref_name }}"
          for edition in full agent; do
            bin_name="volclog"
            build_tags=()
            if [ "$edition" = "agent" ]; then
              bin_name="volclog-agent"
              build_tags=(-tags=agent)
            fi
            out="dist/$bin_name"
            if [ "$GOOS" = "windows" ]; then
              out="${out}.exe"
            fi
            go build -trimpath "${build_tags[@]}" -ldflags "-s -w -X github.com/volcengine-tls/ve-tls-cli/internal/version.Version=${version}" -o "$out" ./cmd/volclog

            pkg_dir="$(mktemp -d)"
            cp "$out" "$pkg_dir/"
            if [ "$GOOS" = "windows" ]; then
              pkg="${bin_name}_${GOOS}_${GOARCH}.zip"
              (cd "$pkg_dir" && zip -q "$pkg" "$(basename "$out")")
            else
              pkg="${bin_name}_${GOOS}_${GOARCH}.tar.gz"
              (cd "$pkg_dir" && tar -czf "$pkg" "$(basename "$out")")
            fi
            mv "$pkg_dir/$pkg" "dist/$pkg"
            sha256sum "dist/$pkg" > "dist/${pkg}.sha256"
            rm -rf "$pkg_dir"
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: volclog-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: ignore
          path: |
            dist/volclog_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            dist/volclog_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256
            dist/volclog-agent_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            dist/volclog-agent_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256
            dist/volclog_${{ matrix.goos }}_${{ matrix.goarch }}.zip
            dist/volclog_${{ matrix.goos }}_${{ matrix.goarch }}.zip.sha256
            dist/volclog-agent_${{ matrix.goos }}_${{ matrix.goarch }}.zip
            dist/volclog-agent_${{ matrix.goos }}_${{ matrix.goarch }}.zip.sha256

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/volclog_*.tar.gz
            dist/volclog_*.tar.gz.sha256
            dist/volclog_*.zip
            dist/volclog_*.zip.sha256
            dist/volclog-agent_*.tar.gz
            dist/volclog-agent_*.tar.gz.sha256
            dist/volclog-agent_*.zip
            dist/volclog-agent_*.zip.sha256
