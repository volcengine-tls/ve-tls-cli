name: release-volclog

on:
  push:
    tags:
      - "volclog-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Test
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          out="dist/volclog"
          if [ "$GOOS" = "windows" ]; then
            out="dist/volclog.exe"
          fi
          go build -ldflags "-s -w -X volclog/internal/version.Version=${{ github.ref_name }}" -o "$out" ./cmd/volclog
      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          cd dist
          if [ "$GOOS" = "windows" ]; then
            pkg="volclog_${GOOS}_${GOARCH}.zip"
            zip -q "$pkg" volclog.exe
          else
            pkg="volclog_${GOOS}_${GOARCH}.tar.gz"
            tar -czf "$pkg" volclog
          fi
          sha256sum "$pkg" > "${pkg}.sha256"
          cp "$pkg" "../$pkg"
          cp "${pkg}.sha256" "../${pkg}.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: volclog-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: ignore
          path: |
            volclog_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            volclog_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256
            volclog_${{ matrix.goos }}_${{ matrix.goarch }}.zip
            volclog_${{ matrix.goos }}_${{ matrix.goarch }}.zip.sha256

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/volclog_*.tar.gz
            dist/volclog_*.tar.gz.sha256
            dist/volclog_*.zip
            dist/volclog_*.zip.sha256
