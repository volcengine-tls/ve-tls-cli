name: ci

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Documentation structure and links
        run: |
          node --test scripts/check-docs_test.mjs
          node scripts/check-docs.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Go fmt
        run: |
          test -z "$(gofmt -l .)"
      - name: Go vet
        run: go vet ./...
      - name: Go test
        run: go test ./...
      - name: install-binary regression test
        run: bash scripts/install-binary_test.sh
      - name: npm package tests
        run: npm run test:npm --silent
      - name: npm pack dry-run
        run: |
          npm pack --dry-run .
          npm pack --dry-run ./npm/human-package
