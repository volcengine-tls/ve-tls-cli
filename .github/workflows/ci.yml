name: ci

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Documentation structure and links
        run: |
          node --test scripts/check-docs_test.mjs
          node scripts/check-docs.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2024.1.1
      - name: Go fmt
        run: |
          test -z "$(find . -path './repos' -prune -o -name '*.go' -print0 | xargs -0 gofmt -l)"
      - name: Go quality
        run: bash scripts/check-go-quality.sh
      - name: Go test
        run: |
          go test . ./cmd/... ./internal/...
          go test -tags=human . ./cmd/... ./internal/...
      - name: install-binary regression test
        run: bash scripts/install-binary_test.sh
      - name: install-local regression test
        run: bash scripts/install-local_test.sh
      - name: npm package tests
        run: npm run test:npm --silent
      - name: npm pack dry-run
        run: |
          npm pack --dry-run .
          npm pack --dry-run ./npm/human-package
