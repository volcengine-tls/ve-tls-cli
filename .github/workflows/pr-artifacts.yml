name: pr-artifacts

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Test
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          out="dist/tlsctl"
          out_runner="dist/tlsctl-runner"
          if [ "$GOOS" = "windows" ]; then
            out="dist/tlsctl.exe"
            out_runner="dist/tlsctl-runner.exe"
          fi
          go build -ldflags "-s -w -X tlsctl/internal/version.Version=${{ github.sha }}" -o "$out" ./cmd/tlsctl
          cp "$out" internal/runner/embedded_tlsctl.bin
          go build -tags embed_tlsctl -ldflags "-s -w" -o "$out_runner" ./cmd/tlsctl-runner
          rm -f internal/runner/embedded_tlsctl.bin
      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          cd dist
          if [ "$GOOS" = "windows" ]; then
            pkg="tlsctl_${GOOS}_${GOARCH}.zip"
            zip -q "$pkg" tlsctl.exe
            pkg_runner="tlsctl-runner_${GOOS}_${GOARCH}.zip"
            zip -q "$pkg_runner" tlsctl-runner.exe
          else
            pkg="tlsctl_${GOOS}_${GOARCH}.tar.gz"
            tar -czf "$pkg" tlsctl
            pkg_runner="tlsctl-runner_${GOOS}_${GOARCH}.tar.gz"
            tar -czf "$pkg_runner" tlsctl-runner
          fi
          sha256sum "$pkg" > "${pkg}.sha256"
          sha256sum "$pkg_runner" > "${pkg_runner}.sha256"
          cp "$pkg" "../$pkg"
          cp "${pkg}.sha256" "../${pkg}.sha256"
          cp "$pkg_runner" "../$pkg_runner"
          cp "${pkg_runner}.sha256" "../${pkg_runner}.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tlsctl-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            tlsctl_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            tlsctl_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256
            tlsctl_${{ matrix.goos }}_${{ matrix.goarch }}.zip
            tlsctl_${{ matrix.goos }}_${{ matrix.goarch }}.zip.sha256
            tlsctl-runner_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            tlsctl-runner_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256
            tlsctl-runner_${{ matrix.goos }}_${{ matrix.goarch }}.zip
            tlsctl-runner_${{ matrix.goos }}_${{ matrix.goarch }}.zip.sha256
